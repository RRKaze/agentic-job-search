name: ATS API verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/*ats.py'
      - 'scripts/discover_v2.py'
      - 'tests/test*.py'
      - '.github/workflows/ats-verification.yml'
  pull_request:
    paths:
      - 'scripts/*ats.py'
      - 'scripts/discover_v2.py'
      - 'tests/test*.py'
      - '.github/workflows/ats-verification.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline ATS adapter tests
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
