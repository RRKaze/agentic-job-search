name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AgenticJobSearch.sln

      - name: Build
        run: dotnet build AgenticJobSearch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgenticJobSearch.sln --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test job view rules
        run: npm run test:model

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag agentic-job-search:ci .

      - name: Smoke test image
        run: |
          docker run --detach --name agentic-job-search-ci \
            --publish 18080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            agentic-job-search:ci
          trap 'docker rm --force agentic-job-search-ci' EXIT
          curl --fail --retry 12 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/api/health/live || { docker logs agentic-job-search-ci; exit 1; }
          curl --fail --retry 3 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:18080/ | grep --quiet '<app-root>' || \
            { docker logs agentic-job-search-ci; exit 1; }

  recovery:
    name: Database recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exercise backup and restore
        run: python3 scripts/test-database-recovery.py
